<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preventa Zárate</title>
<style>
:root{--bg:#eceff1;--card:#fff;--ink:#101820;--mut:#5b6872;--line:#d3dae0;--acc:#0a5c7a;--accT:#fff;--ok:#2e7d4f;--skip:#a8620a;--bad:#b3261e;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#18212a;--ink:#e8eef2;--mut:#94a3ad;--line:#2b3742;--acc:#4cb8dc;--accT:#06222d;--ok:#5cc386;--skip:#e0a04a;--bad:#f2837c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#18212a;--ink:#e8eef2;--mut:#94a3ad;--line:#2b3742;--acc:#4cb8dc;--accT:#06222d;--ok:#5cc386;--skip:#e0a04a;--bad:#f2837c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
h2{font-size:17px;margin:20px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:1;min-width:0;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
.sum{display:flex;justify-content:space-between;align-items:center;margin:12px 0;color:var(--mut);font-size:14px;gap:8px}
button,.btn{font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;display:inline-block;text-align:center}
button.p{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
button.ok{color:var(--ok);border-color:var(--ok)}
button.sk{color:var(--skip);border-color:var(--skip)}
button.dg{color:var(--bad);border-color:var(--bad)}
button.w{width:100%}
ol{list-style:none;margin:0;padding:0}
.stop{display:flex;gap:12px;position:relative;padding-bottom:12px}
.stop:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line)}
.n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--accT);font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.stop.d .n{background:var(--ok)}.stop.s .n{background:var(--skip)}
.b{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stop.d .b,.stop.s .b{opacity:.65}
.b b{display:block;font-size:17px}
.b .t{display:block;color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row>*{flex:1 1 auto;padding:8px 10px;font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.res{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.res.big{font-size:20px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--mut);text-align:center;padding:28px 8px}
nav{z-index:20;position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;font-size:12px;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:14px;display:none;z-index:30}
details{margin-top:18px}summary{padding:8px 0;color:var(--acc)}
.btn.p{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
#mapa{position:relative;z-index:0;isolation:isolate;height:62vh;min-height:320px;border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-top:10px}
.mk{width:30px;height:30px;border-radius:50%;background:#0a5c7a;color:#fff;font:700 13px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.d{background:#2e7d4f}.mk.s{background:#a8620a}
.leaflet-popup-content{color:#14202b;font-size:14px}
.est{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px;margin-top:6px;border:1px solid}
.e-ok{color:var(--ok);border-color:var(--ok)}
.e-soon{color:var(--skip);border-color:var(--skip)}
.e-closed{color:var(--bad);border-color:var(--bad)}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.pr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pr span:first-child{color:var(--mut);font-size:13px}
.pr b{font-size:18px;white-space:nowrap}
</style>
</head>
<body>
<main id="view"></main>
<div id="toast"></div>
<nav>
<button data-tab="hoy">Ruta</button>
<button data-tab="cli">Clientes</button>
<button data-tab="pre">Precios</button>
<button data-tab="ped">Pedido</button>
<button data-tab="ven">Ventas</button>
<button data-tab="pap">Papelera</button>
</nav>
<script>
var K="preventa_zarate_v1",BASE=[-34.0971,-59.0282];
var DIAS=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
var S=load(),tab="hoy",editId=null,showForm=false,q="";
var dia=(function(){var d=DIAS[new Date().getDay()];return DIAS.indexOf(d)%6===0?"lunes":d})();
S.ventas=S.ventas||[];var VM=(function(){var d=new Date();return d.getFullYear()*12+d.getMonth()})(),vsel=null;
function load(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return{clientes:[],papelera:[],hoy:{f:"",v:[],s:[]},pos:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fm(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS"}).format(n)}
function num(t){t=String(t).replace(/[$\s]/g,"");if(t.indexOf(",")>-1)t=t.replace(/\./g,"").replace(",",".");var n=parseFloat(t);return isFinite(n)&&n>=0?n:0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3500)}
function normDia(d){d=String(d||"").trim().toLowerCase();return d==="miércoles"?"miercoles":d}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function hasC(c){return typeof c.lat==="number"&&typeof c.lon==="number"}
function hav(a,b){var R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function dw(a,b){var k=111320,dy=Math.abs(b[0]-a[0])*k,dx=Math.abs(b[1]-a[1])*k*Math.cos(a[0]*Math.PI/180);return dx+dy}
function fdist(m){return m>=1000?(m/1000).toFixed(1).replace(".",",")+" km":(Math.max(10,Math.round(m/10)*10))+" m"}
function total(o,r){var t=0,p=o;r.forEach(function(c){var x=[c.lat,c.lon];t+=dw(p,x);p=x});return t}
function optim(items){
 var ci=items.filter(hasC),rest=items.filter(function(c){return!hasC(c)}),o=S.pos||BASE,r=[],p=o,pool=ci.slice();
 while(pool.length){var bi=0,bd=1e18;pool.forEach(function(c,i){var d=dw(p,[c.lat,c.lon]);if(d<bd){bd=d;bi=i}});var c=pool.splice(bi,1)[0];r.push(c);p=[c.lat,c.lon]}
 var imp=r.length>=3&&S.modo==="ruta",best=total(o,r);
 while(imp){imp=false;
  for(var i=0;i<r.length-1&&!imp;i++)for(var j=i+1;j<r.length&&!imp;j++){
   var n=r.slice();var seg=n.slice(i,j+1).reverse();Array.prototype.splice.apply(n,[i,j-i+1].concat(seg));
   var d=total(o,n);if(d+.01<best){r=n;best=d;imp=true}}}
 return r.concat(rest)}
function hoyState(){var f=new Date().toISOString().slice(0,10);if(!S.hoy||S.hoy.f!==f){S.hoy={f:f,v:[],s:[]};save()}return S.hoy}
function mapUrl(c){return "https://www.google.com/maps/dir/?api=1&destination="+(hasC(c)?c.lat+","+c.lon:encodeURIComponent((c.direccion||"")+", Zárate, Buenos Aires"))}
function gps(cb){if(!navigator.geolocation){toast("Este navegador no permite usar la ubicación.");return}
 navigator.geolocation.getCurrentPosition(function(p){cb([p.coords.latitude,p.coords.longitude])},function(){toast("No se pudo obtener la ubicación. Revisá el permiso de ubicación del navegador.")},{enableHighAccuracy:true,timeout:10000})}
function parseLoc(t){t=String(t||"");var m=t.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);if(!m)return null;var a=parseFloat(m[1]),b=parseFloat(m[2]);return(Math.abs(a)<=90&&Math.abs(b)<=180)?[a,b]:null}

async function geocode(addr){
 var u="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q="+encodeURIComponent(addr+", Zárate, Buenos Aires, Argentina");
 var r=await fetch(u,{headers:{"Accept-Language":"es"}});var j=await r.json();
 if(!j.length)return null;return[parseFloat(j[0].lat),parseFloat(j[0].lon),j[0].display_name]}
async function guardarCliente(){
 var n=$("#f-n").value.trim(),d=$("#f-d").value.trim();if(!n||!d){toast("Completá el nombre y la dirección.");return}
 var lt=$("#f-l").value.trim(),p=parseLoc(lt);if(lt&&!p){toast("No entendí la ubicación. Usá el formato -34.0971, -59.0282 o dejalo vacío.");return}
 var msg="Cliente guardado.";
 if(!p){toast("Buscando la dirección en el mapa...");
  try{var g=await geocode(d);if(g){p=[g[0],g[1]];msg="Cliente guardado. Ubicación: "+g[2].slice(0,70)}else msg="Cliente guardado, pero no se encontró la dirección. Probá con calle y número."}
  catch(e){msg="Cliente guardado sin ubicación: no se pudo buscar la dirección (¿hay internet?)."}}
 var c=S.clientes.filter(function(x){return x.id===editId})[0];if(!c){c={id:uid()};S.clientes.push(c)}
 c.nombre=n;c.direccion=d;c.dia=$("#f-dia").value;c.horario=$("#f-h").value.trim();c.telefono=$("#f-t").value.trim();
 if(p){c.lat=p[0];c.lon=p[1]}else{delete c.lat;delete c.lon}
 save();showForm=false;editId=null;render();toast(msg)}
function importar(txt){
 try{var arr=JSON.parse(txt);if(!Array.isArray(arr))throw 0;var k=0,rp=0;
  arr.forEach(function(x){if(!x||!x.nombre)return;
   var nom=String(x.nombre).trim(),dir=String(x.direccion||"").trim();
   if(S.clientes.some(function(c){return norm(c.nombre)===norm(nom)&&norm(c.direccion)===norm(dir)})){rp++;return}
   var lat=parseFloat(x.latitud),lon=parseFloat(x.longitud);
   var c={id:uid(),nombre:nom,direccion:dir,dia:normDia(x.dia)||"lunes",horario:x.horario||"",telefono:x.telefono||""};
   if(isFinite(lat)&&isFinite(lon)){c.lat=lat;c.lon=lon}S.clientes.push(c);k++});
  save();var t=$("#imp");if(t)t.value="";render();toast("Se importaron "+k+" clientes"+(rp?" ("+rp+" ya estaban)":"")+".")}
 catch(err){toast("No se pudo leer el contenido. Tiene que ser el archivo .json completo.")}}
var geoBusy=false;
async function geoall(){
 if(geoBusy)return;var L=S.clientes.filter(function(c){return!hasC(c)});if(!L.length)return;geoBusy=true;var ok=0;
 for(var i=0;i<L.length;i++){toast("Buscando ubicaciones: "+(i+1)+" de "+L.length+"...");
  try{var g=await geocode(L[i].direccion);if(g){L[i].lat=g[0];L[i].lon=g[1];ok++;save()}}catch(e){}
  await new Promise(function(r){setTimeout(r,1100)})}
 geoBusy=false;render();toast("Listo: se encontró la ubicación de "+ok+" de "+L.length+" clientes.")}
var MAP=null,MST=null,hoyVista="lista";
function ctrl(){return"<div class=chips style='margin-top:8px'><button class='chip"+(hoyVista==="lista"?" on":"")+"' data-a=vista data-id=lista>Lista</button><button class='chip"+(hoyVista==="mapa"?" on":"")+"' data-a=vista data-id=mapa>Mapa</button><button class='chip"+(S.modo!=="ruta"?" on":"")+"' style='margin-left:10px' data-a=modo data-id=cerca>Más cercano</button><button class='chip"+(S.modo==="ruta"?" on":"")+"' data-a=modo data-id=ruta>Optimizada</button></div>"}
function loadLeaflet(cb){
 if(window.L&&window.L.map){cb();return}
 if(!document.getElementById("lfcss")){var l=document.createElement("link");l.id="lfcss";l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css";document.head.appendChild(l)}
 var sc=document.getElementById("lfjs");
 if(!sc){sc=document.createElement("script");sc.id="lfjs";sc.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js";document.head.appendChild(sc)}
 sc.addEventListener("load",cb);
 sc.addEventListener("error",function(){var m=$("#mapa");if(m)m.innerHTML="<p class=empty>No se pudo cargar el mapa. Revisá tu conexión a internet.</p>"})}
function popMk(c,cls){
 var e=dia===realDia()?estado(c):null;
 return"<b>"+esc(c.nombre)+"</b><br>"+esc(c.direccion)+(c.horario?"<br>Horario: "+esc(c.horario):"")+(e?"<br>"+esc(e.t):"")+"<div class=row style='margin-top:8px'>"+(cls?"<button data-a=undo data-id="+c.id+">Volver a pendiente</button>":"<button class=ok data-a=ok data-id="+c.id+">Visitado</button><button class=sk data-a=skip data-id="+c.id+">Saltar</button>")+"<a class=btn href='"+mapUrl(c)+"' target=_blank rel=noopener>Cómo llegar</a></div>"}
function initMapa(){
 if(!$("#mapa"))return;
 loadLeaflet(function(){
  var el=$("#mapa"),Lf=window.L;if(!el||MAP||!Lf)return;
  var h=hoyState(),all=S.clientes.filter(function(c){return c.dia===dia}),
   pend=optim(all.filter(function(c){return h.v.indexOf(c.id)<0&&h.s.indexOf(c.id)<0})),
   done=all.filter(function(c){return h.v.indexOf(c.id)>-1||h.s.indexOf(c.id)>-1}),pts=[];
  MAP=Lf.map(el).setView(S.pos||BASE,14);
  Lf.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(MAP);
  function mk(c,txt,cls){if(!hasC(c))return;
   Lf.marker([c.lat,c.lon],{icon:Lf.divIcon({className:"",html:"<div class='mk "+cls+"'>"+txt+"</div>",iconSize:[30,30],iconAnchor:[15,15]})}).addTo(MAP).bindPopup(popMk(c,cls));pts.push([c.lat,c.lon])}
  pend.forEach(function(c,i){mk(c,String(i+1),"")});
  done.forEach(function(c){var v=h.v.indexOf(c.id)>-1;mk(c,v?"✔":"–",v?"d":"s")});
  if(S.pos){Lf.circleMarker(S.pos,{radius:9,color:"#fff",weight:3,fillColor:"#1a73e8",fillOpacity:1}).addTo(MAP).bindTooltip("Estás acá");pts.push(S.pos)}
  if(MST)MAP.setView(MST.c,MST.z);else if(pts.length)MAP.fitBounds(pts,{padding:[30,30],maxZoom:17});
  setTimeout(function(){if(MAP)MAP.invalidateSize()},60)})}
function vHoy(){
 lastSig=hoySig();var h=hoyState(),L=S.clientes.filter(function(c){return c.dia===dia});
 var pend=optim(L.filter(function(c){return h.v.indexOf(c.id)<0&&h.s.indexOf(c.id)<0}));
 var done=L.filter(function(c){return h.v.indexOf(c.id)>-1||h.s.indexOf(c.id)>-1});
 var o="<h1>Ruta de hoy</h1><div class=chips>"+DIAS.slice(1,6).map(function(d){return"<button class='chip"+(d===dia?" on":"")+"' data-a=dia data-id="+d+">"+cap(d.slice(0,3))+"</button>"}).join("")+"</div>"+ctrl();
 o+="<div class=sum><span>"+(L.length?"Quedan "+pend.length+" de "+L.length:"Sin clientes este día")+"</span><button data-a=ubic>"+(S.pos?"Ubicación actualizada":"Usar mi ubicación")+"</button></div>";
 if(!L.length)return o+"<p class=empty>Todavía no hay clientes para el "+dia+". Agregalos en la pestaña Clientes.</p>";
 if(hoyVista==="mapa"){var sinU=L.filter(function(c){return!hasC(c)}).length;return o+"<div id=mapa></div><p class=hint>Azul: pendientes · Verde: visitados · Naranja: salteados. Tocá un número para ver el cliente.</p>"+(sinU?"<p class=hint>"+sinU+" cliente"+(sinU>1?"s":"")+" de este día no aparece"+(sinU>1?"n":"")+" en el mapa porque no tiene ubicación.</p>":"")}
 if(!pend.length)o+="<p class=empty>Terminaste todas las visitas de este día.</p>";
 o+="<ol>";
 pend.forEach(function(c,i){o+=stop(c,i+1,"",S.pos&&hasC(c)?dw(S.pos,[c.lat,c.lon]):null)});
 done.forEach(function(c){var v=h.v.indexOf(c.id)>-1;o+=stop(c,v?"✔":"–",v?"d":"s")});
 return o+"</ol>"}
var SOON=20,lastSig="";
function realDia(){return DIAS[new Date().getDay()]}
function hh(m){m=m%1440;return Math.floor(m/60)+":"+("0"+m%60).slice(-2)}
function horaMin(h){
 var t=String(h||"").toLowerCase();if(!t.trim())return null;
 var m=t.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(?:a|-|–|hasta)\s*(\d{1,2})(?:[:.](\d{2}))?/);
 if(!m){return/24\s*(hs|horas)/.test(t)?{a:0,b:1440}:null}
 var a=+m[1]*60+(+m[2]||0),b=+m[3]*60+(+m[4]||0);if(b<=a)b+=1440;return{a:a,b:b}}
function estado(c,nm){
 var r=horaMin(c.horario);if(!r)return null;
 if(nm==null){var n=new Date();nm=n.getHours()*60+n.getMinutes()}
 if(r.a===0&&r.b===1440)return{t:"Abierto las 24 hs",cls:"e-ok"};
 if(nm>=r.a&&nm<r.b)return{t:"Abierto hasta las "+hh(r.b),cls:"e-ok"};
 if(nm<r.a){var d=r.a-nm;return d<=SOON?{t:"Abre pronto · "+hh(r.a),cls:"e-soon"}:{t:"Cerrado · abre a las "+hh(r.a),cls:"e-closed"}}
 return{t:"Ya cerró",cls:"e-closed"}}
function badge(c){if(dia!==realDia())return"";var e=estado(c);return e?"<span class='est "+e.cls+"'>"+esc(e.t)+"</span>":""}
function hoySig(){if(dia!==realDia())return"";return S.clientes.filter(function(c){return c.dia===dia}).map(function(c){var e=estado(c);return e?e.t:""}).join("|")}
setInterval(function(){if(tab==="hoy"&&hoyVista==="lista"&&hoySig()!==lastSig)render()},60000);
function stop(c,n,cls,dist){
 var acts=cls?"<button data-a=undo data-id="+c.id+">Volver a pendiente</button>":"<button class=ok data-a=ok data-id="+c.id+">Visitado</button><button class=sk data-a=skip data-id="+c.id+">Saltar</button>";
 return"<li class='stop "+cls+"'><span class=n>"+n+"</span><div class=b><b>"+esc(c.nombre)+"</b><span class=t>"+esc(c.direccion)+"</span>"+(dist!=null?"<span class=t>A unos "+fdist(dist)+" caminando</span>":"")+(c.horario?"<span class=t>Horario: "+esc(c.horario)+"</span>":"")+(cls?"":badge(c))+"<div class=row>"+acts+"<a class=btn href='"+mapUrl(c)+"' target=_blank rel=noopener>Mapa</a>"+(c.telefono?"<a class=btn href='tel:"+esc(c.telefono.replace(/[^\d+]/g,""))+"'>Llamar</a>":"")+"</div></div></li>"}

function vCli(){
 var o="<h1>Clientes</h1>";
 if(showForm)o+=form();else o+="<button class='p w' data-a=nuevo>Agregar cliente</button>";
 var sinU=S.clientes.filter(function(c){return!hasC(c)}).length;
 if(sinU)o+="<div class=card><b>"+sinU+" cliente"+(sinU>1?"s":"")+" sin ubicación</b><p class=hint>Sin ubicación no entran en el orden de la ruta. La app busca las direcciones en el mapa de a una, tarda un segundo por cliente.</p><button class='p w' data-a=geoall>Buscar ubicaciones</button></div>";
 o+="<label for=q>Buscar por nombre o dirección</label><input id=q value='"+esc(q)+"'><div id=lista>"+lista()+"</div>";
 o+="<details><summary>Importar y respaldo</summary><label for=impf>Importar clientes desde un archivo .json</label><input id=impf type=file accept='.json,application/json'><p class=hint>También podés pegar el texto del archivo acá. Los clientes que ya existen no se repiten.</p><textarea id=imp rows=4 placeholder='Pegá acá el contenido del archivo'></textarea><div class=row><button class=p data-a=import>Importar clientes</button><button data-a=resp>Copiar respaldo</button></div></details>";
 return o}
function lista(){
 var t=q.trim().toLowerCase(),L=S.clientes.filter(function(c){return!t||(c.nombre+" "+c.direccion).toLowerCase().indexOf(t)>-1});
 if(!L.length)return"<p class=empty>"+(S.clientes.length?"Sin resultados.":"Todavía no cargaste clientes.")+"</p>";
 return L.map(function(c){return"<div class=card><b>"+esc(c.nombre)+"</b><span class=t style='display:block;color:var(--mut);font-size:14px'>"+esc(c.direccion)+" · "+cap(c.dia)+(hasC(c)?"":" · sin ubicación")+"</span><div class=row><button data-a=edit data-id="+c.id+">Editar</button><button class=dg data-a=del data-id="+c.id+">A la papelera</button></div></div>"}).join("")}
function form(){
 var c=S.clientes.filter(function(x){return x.id===editId})[0]||{};
 return"<div class=card><b>"+(editId?"Editar cliente":"Nuevo cliente")+"</b><label for=f-n>Nombre del local o dueño</label><input id=f-n value='"+esc(c.nombre)+"'><label for=f-d>Dirección y altura</label><input id=f-d value='"+esc(c.direccion)+"'><label for=f-dia>Día de visita</label><select id=f-dia>"+DIAS.slice(1,6).map(function(d){return"<option value="+d+(d===(c.dia||dia)?" selected":"")+">"+cap(d)+"</option>"}).join("")+"</select><div class=two><div><label for=f-h>Horario</label><input id=f-h value='"+esc(c.horario)+"'></div><div><label for=f-t>Teléfono</label><input id=f-t type=tel value='"+esc(c.telefono)+"'></div></div><label for=f-l>Ubicación (opcional)</label><input id=f-l placeholder='-34.0971, -59.0282' value='"+(hasC(c)?c.lat+", "+c.lon:"")+"'><p class=hint>Dejalo vacío y la app busca la dirección sola al guardar. También podés tocar el botón parado frente al local.</p><div class=row><button data-a=loc>Usar mi ubicación actual</button></div><div class=row><button class=p data-a=guardar>Guardar cliente</button><button data-a=cancelar>Cancelar</button></div></div>"}

function D(){if(!S.draft)S.draft={items:[],d:"",m:String(S.comPct||5),cli:""};return S.draft}
function money(n){return Math.round(n*100)/100}
function pedTot(){var d=D(),sub=0;d.items.forEach(function(l){sub+=num(l.precio)*num(l.cant)});var de=Math.min(num(d.d),100),desc=sub*de/100,tot=sub-desc;return{sub:money(sub),desc:money(desc),tot:money(tot),com:money(tot*num(d.m)/100)}}
function pedOut(){var e=$("#pout");if(!e)return;var t=pedTot();e.innerHTML="<div class=res><span>Subtotal</span><span>"+fm(t.sub)+"</span></div><div class=res><span>Descuento</span><span>− "+fm(t.desc)+"</span></div><div class='res big'><span>Total</span><span>"+fm(t.tot)+"</span></div><div class=res><span>Tu comisión</span><span>"+fm(t.com)+"</span></div>"}
function copiar(t){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){toast("Copiado.")},function(){toast("No se pudo copiar. Mantené apretado el texto para copiarlo.")});else toast("No se pudo copiar. Mantené apretado el texto para copiarlo.")}
function findCli(t){var n=norm(t).trim();if(!n)return null;return S.clientes.filter(function(c){return norm(c.nombre).trim()===n||norm(c.nombre+" — "+c.direccion).trim()===n||norm(c.nombre+" "+c.direccion).trim()===n})[0]||null}
function armarMsg(){var d=D(),L=d.items.map(function(l){var q=String(l.cant).trim()||"1";return q+" "+String(l.nom).trim()+(l.cod?" cod"+l.cod:"")}).join("\n"),t=(d.cli||"").trim(),c=findCli(t);return L+"\n\n"+(c?c.nombre+"\n"+c.direccion+"\nhorario: "+(c.horario||""):t)}
function pedBus(){
 if(!window.pbq)return"";
 if(!P)return"<p class=hint>Cargando precios...</p>";
 var toks=norm(window.pbq).trim().split(/\s+/),map={},ord=[];
 P.productos.forEach(function(p){for(var i=0;i<toks.length;i++)if(p[4].indexOf(toks[i])<0)return;var k=p[0]+"|"+p[1].toLowerCase();if(!map[k]){map[k]={cod:p[0],nom:p[1],pr:[]};ord.push(map[k])}map[k].pr.push([p[3],p[2]])});
 if(!ord.length)return"<p class=hint>No se encontraron productos.</p>";
 if(toks.length===1&&/^\d+$/.test(toks[0]))ord.sort(function(a,b){return(b.cod===toks[0])-(a.cod===toks[0])});
 return ord.slice(0,8).map(function(x){return"<div class=card><b>"+esc(x.nom)+"</b><span class=hint style='display:block'>Código "+esc(x.cod)+"</span><div class=row>"+x.pr.map(function(r){return"<button data-a=addp data-cod='"+esc(x.cod)+"' data-li="+r[0]+">"+esc(P.listas[r[0]].nombre+" ("+P.listas[r[0]].iva+") "+fm(r[1]))+"</button>"}).join("")+"</div></div>"}).join("")}
function telNorm(r){var d=String(r||"").replace(/\D/g,"");if(!d)return"";d=d.replace(/^00/,"");
 if(d.indexOf("549")===0)return d;if(d.indexOf("54")===0)return"549"+d.slice(2);
 d=d.replace(/^0/,"");
 if(d.length===12&&d.substr(4,2)==="15")d=d.slice(0,4)+d.slice(6);
 else if(d.length===12&&d.substr(2,2)==="15")d=d.slice(0,2)+d.slice(4);
 else if(d.length===11&&d.substr(3,2)==="15")d=d.slice(0,3)+d.slice(5);
 return"549"+d}
function waUrl(t){var n=telNorm(S.jefaTel);return"https://wa.me/"+n+"?text="+encodeURIComponent(t||"")}
function jprev(){var n=telNorm(S.jefaTel);return n?"Se envía a +"+n+". Si no es tu jefa, revisá el número.":"Sin número, WhatsApp te va a pedir elegir a quién mandarlo."}
function jefaCard(){return"<label for=jtel>WhatsApp de tu jefa</label><input id=jtel inputmode=tel placeholder='Ej: 3487123456' value='"+esc(S.jefaTel||"")+"'><p class=hint id=jprev>"+jprev()+"</p><p class=hint>Escribilo con el código de área, sin 0 y sin 15.</p>"}
function vPed(){
 if(S.ultimo)return"<h1>Pedido</h1><div class=card><b>Venta guardada</b><p class=hint>Mensaje para tu jefa:</p><textarea id=msg rows=9 readonly>"+esc(S.ultimo)+"</textarea><a id=wabtn class='btn p' style='display:block;margin-top:10px' href='"+waUrl(S.ultimo)+"' target=_blank rel=noopener>Enviar pedido por WhatsApp</a><div class=row><button data-a=copmsg>Copiar mensaje</button></div>"+(telNorm(S.jefaTel)?"":jefaCard())+"</div><button class=w data-a=nuevo_ped>Nuevo pedido</button>";
 var d=D(),o="<h1>Pedido</h1><label for=pbq>Agregar producto (código o nombre)</label><input id=pbq inputmode=search autocomplete=off placeholder='Ej: 1957 o bolsa polip' value='"+esc(window.pbq||"")+"'><div id=pbus>"+pedBus()+"</div>";
 o+=d.items.length?d.items.map(function(l,i){return"<div class=card>"+(l.cod?"<b>"+esc(l.nom)+"</b><span class=hint style='display:block'>Código "+esc(l.cod)+" · "+esc(l.lista)+"</span>":"<label>Nombre del producto</label><input data-f=nom data-i="+i+" value='"+esc(l.nom)+"'>")+"<div class=two><div><label>Cantidad</label><input inputmode=decimal data-f=cant data-i="+i+" value='"+esc(l.cant)+"'></div><div><label>Precio $</label><input inputmode=decimal data-f=precio data-i="+i+" value='"+esc(l.precio)+"'></div></div><div class=row><button class=dg data-a=delp data-i="+i+">Quitar</button></div></div>"}).join(""):"<p class=empty>Todavía no agregaste productos.</p>";
 o+="<div class=row><button data-a=manual>Agregar producto manual</button></div>";
 o+="<div class=card><div class=two><div><label>Descuento %</label><input inputmode=decimal data-f=d value='"+esc(d.d)+"'></div><div><label>Comisión %</label><input inputmode=decimal data-f=m value='"+esc(d.m)+"'></div></div><div id=pout></div></div>";
 o+="<label for=pcli>¿Para quién es este pedido?</label><input id=pcli list=pcl autocomplete=off placeholder='Ej: susana dorrego 471' value='"+esc(d.cli)+"'><datalist id=pcl>"+S.clientes.map(function(c){return"<option value='"+esc(c.nombre+" — "+c.direccion)+"'>"}).join("")+"</datalist><p class=hint>Si elegís un cliente de tu lista, el mensaje lleva su dirección y horario solos.</p>";
 o+="<details"+(telNorm(S.jefaTel)?"":" open")+"><summary>Número de tu jefa (para WhatsApp)</summary>"+jefaCard()+"</details>";
 o+="<button class='p w' data-a=guardarv style='margin-top:12px'>Guardar venta y armar mensaje</button><button class=w data-a=vaciarp style='margin-top:8px'>Vaciar pedido</button>";
 return o}
function mkey(f){var d=new Date(f);return d.getFullYear()*12+d.getMonth()}
function vVen(){
 var L=S.ventas.filter(function(v){return mkey(v.fecha)===VM}),tot=0,com=0;L.forEach(function(v){tot+=v.total;com+=v.comision});
 var lab=new Date(Math.floor(VM/12),VM%12,1).toLocaleDateString("es-AR",{month:"long",year:"numeric"});
 var o="<h1>Ventas</h1><div class=sum><button data-a=mprev>◀</button><b style='color:var(--ink);text-transform:capitalize'>"+lab+"</b><button data-a=mnext>▶</button></div><div class=card><div class=res><span>Ventas realizadas</span><span>"+L.length+"</span></div><div class=res><span>Total vendido</span><span>"+fm(money(tot))+"</span></div><div class='res big'><span>Tu comisión</span><span>"+fm(money(com))+"</span></div></div>";
 if(!L.length)return o+"<p class=empty>Todavía no hay ventas este mes.</p>";
 return o+L.slice().reverse().map(function(v){return"<div class=card><b>"+esc(v.cliente)+"</b><span class=hint style='display:block'>"+new Date(v.fecha).toLocaleDateString("es-AR")+" · "+fm(v.total)+" · comisión "+fm(v.comision)+"</span><div class=row><button data-a=vermsg data-id="+v.id+">"+(vsel===v.id?"Ocultar mensaje":"Ver mensaje")+"</button><button class=dg data-a=delv data-id="+v.id+">Borrar</button></div>"+(vsel===v.id?"<textarea rows=7 readonly>"+esc(v.texto)+"</textarea><div class=row><a class='btn p' href='"+waUrl(v.texto)+"' target=_blank rel=noopener>Enviar por WhatsApp</a><button data-a=copv data-id="+v.id+">Copiar</button></div>":"")+"</div>"}).join("")}

function vPap(){
 var o="<h1>Papelera</h1>";
 if(!S.papelera.length)return o+"<p class=empty>La papelera está vacía.</p>";
 o+=S.papelera.map(function(c){return"<div class=card><b>"+esc(c.nombre)+"</b><span style='display:block;color:var(--mut);font-size:14px'>"+esc(c.direccion)+"</span><div class=row><button class=p data-a=rest data-id="+c.id+">Restaurar</button><button class=dg data-a=fin data-id="+c.id+">Borrar para siempre</button></div></div>"}).join("");
 return o+"<button class='dg w' data-a=vaciar style='margin-top:10px'>Vaciar papelera</button>"}

var P=null;
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function prep(j){j.productos.forEach(function(p){p[4]=norm(p[0]+" "+p[1])});return j}
function loadPrecios(){
 try{var c=localStorage.getItem("preventa_precios_v1");if(c)P=prep(JSON.parse(c))}catch(e){}
 fetch("precios.json?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
  try{localStorage.setItem("preventa_precios_v1",JSON.stringify(j))}catch(e){}
  P=prep(j);if(tab==="pre"&&!document.getElementById("pq").value)render();else if(tab==="pre")$("#pres").innerHTML=preRes()
 }).catch(function(){})}
function etq(i){var l=P.listas[i];return l.nombre+" · "+[l.lista,l.iva].filter(Boolean).join(", ")}
function vPre(){
 return"<h1>Precios</h1><label for=pq>Código o nombre del producto</label><input id=pq inputmode=search autocomplete=off placeholder='Ej: 1957 o bolsa polip 15x20' value='"+esc(window.pq||"")+"'><div id=pres>"+preRes()+"</div>"}
function preRes(){
 if(!P)return"<p class=empty>Cargando precios... Si no aparecen, revisá que el archivo precios.json esté subido a GitHub.</p>";
 var t=norm(window.pq||"").trim();
 if(!t)return"<p class=hint>Listas cargadas:</p>"+P.listas.map(function(l,i){var n=P.productos.filter(function(p){return p[3]===i}).length;return"<div class=card><b>"+esc(l.nombre)+"</b><span style='display:block;color:var(--mut);font-size:14px'>"+esc([l.lista,l.iva,l.fecha].filter(Boolean).join(" · "))+" · "+n+" productos</span></div>"}).join("");
 var toks=t.split(/\s+/),map={},ord=[];
 P.productos.forEach(function(p){
  for(var i=0;i<toks.length;i++)if(p[4].indexOf(toks[i])<0)return;
  var k=p[0]+"|"+p[1].toLowerCase();
  if(!map[k]){map[k]={cod:p[0],nom:p[1],pr:[]};ord.push(map[k])}
  map[k].pr.push([p[3],p[2]])});
 if(!ord.length)return"<p class=empty>No se encontraron productos con eso.</p>";
 if(toks.length===1&&/^\d+$/.test(toks[0]))ord.sort(function(a,b){return(b.cod===toks[0])-(a.cod===toks[0])});
 var o="<p class=hint>"+ord.length+" producto"+(ord.length>1?"s":"")+(ord.length>40?" (se muestran los primeros 40, refiná la búsqueda)":"")+"</p>";
 ord.slice(0,40).forEach(function(x){
  o+="<div class=card><b>"+esc(x.nom)+"</b><span style='display:block;color:var(--mut);font-size:14px'>Código "+esc(x.cod)+"</span>"+x.pr.map(function(r){return"<div class=pr><span>"+esc(etq(r[0]))+"</span><b>"+fm(r[1])+"</b></div>"}).join("")+"</div>"});
 return o}
function render(){
 if(MAP){try{MST={c:MAP.getCenter(),z:MAP.getZoom()};MAP.remove()}catch(e){}MAP=null}
 $("#view").innerHTML={hoy:vHoy,cli:vCli,pre:vPre,ped:vPed,ven:vVen,pap:vPap}[tab]();
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab)});
 if(tab==="ped")pedOut();
 if(tab==="hoy"&&hoyVista==="mapa")initMapa()}
function take(id){var i=S.clientes.findIndex(function(c){return c.id===id});return i<0?null:S.clientes.splice(i,1)[0]}
function mark(id,k){var h=hoyState();["v","s"].forEach(function(x){var i=h[x].indexOf(id);if(i>-1)h[x].splice(i,1)});if(k)h[k].push(id);if(k==="v"){var cv=S.clientes.filter(function(x){return x.id===id})[0];if(cv&&hasC(cv)){S.pos=[cv.lat,cv.lon];MST=null}}save();render()}

document.addEventListener("click",function(e){
 var t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
 if(a==="dia"){dia=id;MST=null;render()}
 else if(a==="vista"){hoyVista=id;MST=null;render()}
 else if(a==="modo"){S.modo=id;save();render()}
 else if(a==="ubic")gps(function(p){S.pos=p;MST=null;save();render();toast("Ruta recalculada desde tu ubicación.")})
 else if(a==="ok")mark(id,"v")
 else if(a==="skip")mark(id,"s")
 else if(a==="undo")mark(id,null)
 else if(a==="nuevo"){showForm=true;editId=null;render()}
 else if(a==="cancelar"){showForm=false;editId=null;render()}
 else if(a==="edit"){showForm=true;editId=id;render();window.scrollTo(0,0)}
 else if(a==="loc")gps(function(p){$("#f-l").value=p[0].toFixed(6)+", "+p[1].toFixed(6);toast("Ubicación cargada.")})
 else if(a==="guardar"){guardarCliente()}
 else if(a==="del"){var c2=take(id);if(c2){c2.eliminado=new Date().toISOString();S.papelera.push(c2);save();render();toast("Movido a la papelera.")}}
 else if(a==="rest"){var i=S.papelera.findIndex(function(c){return c.id===id});if(i>-1){var r=S.papelera.splice(i,1)[0];delete r.eliminado;S.clientes.push(r);save();render();toast("Cliente restaurado.")}}
 else if(a==="fin"){S.papelera=S.papelera.filter(function(c){return c.id!==id});save();render()}
 else if(a==="vaciar"){if(confirm("¿Borrar todo lo que hay en la papelera?")){S.papelera=[];save();render()}}
 else if(a==="addp"){var li=+b.dataset.li,cod=b.dataset.cod,pp=P.productos.filter(function(x){return x[0]===cod&&x[3]===li})[0],dd=D();
  if(pp){var ex=dd.items.filter(function(l){return l.cod===cod&&l.lista===P.listas[li].nombre})[0];
   if(ex)ex.cant=String(num(ex.cant)+1);else dd.items.push({cod:cod,nom:pp[1],precio:pp[2],cant:"1",lista:P.listas[li].nombre});
   window.pbq="";save();render();toast("Agregado al pedido.")}}
 else if(a==="manual"){D().items.push({cod:"",nom:"",precio:"",cant:"1",lista:"manual"});save();render()}
 else if(a==="delp"){D().items.splice(+b.dataset.i,1);save();render()}
 else if(a==="vaciarp"){if(confirm("¿Vaciar todo el pedido?")){S.draft=null;save();render()}}
 else if(a==="guardarv"){var dg=D(),it=dg.items.filter(function(l){return num(l.cant)>0&&String(l.nom).trim()});
  if(!it.length){toast("Agregá al menos un producto con cantidad.");return}
  if(!String(dg.cli).trim()){toast("Escribí para quién es el pedido.");return}
  dg.items=it;var tt=pedTot(),cc=findCli(dg.cli),msg=armarMsg();
  S.ventas.push({id:uid(),fecha:new Date().toISOString(),cliente:cc?cc.nombre:String(dg.cli).trim(),items:it,total:tt.tot,comPct:num(dg.m),comision:tt.com,texto:msg});
  S.comPct=num(dg.m);S.ultimo=msg;S.draft=null;save();render()}
 else if(a==="nuevo_ped"){S.ultimo=null;save();render()}
 else if(a==="copmsg")copiar(S.ultimo)
 else if(a==="mprev"){VM--;render()}
 else if(a==="mnext"){VM++;render()}
 else if(a==="vermsg"){vsel=vsel===id?null:id;render()}
 else if(a==="copv"){var vv=S.ventas.filter(function(x){return x.id===id})[0];if(vv)copiar(vv.texto)}
 else if(a==="delv"){if(confirm("¿Borrar esta venta?")){S.ventas=S.ventas.filter(function(x){return x.id!==id});save();render()}}
 else if(a==="import")importar($("#imp").value)
 else if(a==="geoall")geoall()
 else if(a==="resp"){var txt=JSON.stringify(S.clientes);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast("Respaldo copiado. Pegalo en Notas para guardarlo.")},function(){$("#imp").value=txt;toast("Copialo desde el cuadro de texto.")});
  else{$("#imp").value=txt;toast("Copialo desde el cuadro de texto.")}}
});
document.addEventListener("input",function(e){
 var t=e.target;
 if(t.id==="q"){q=t.value;$("#lista").innerHTML=lista()}
 else if(t.id==="pq"){window.pq=t.value;$("#pres").innerHTML=preRes()}
 else if(t.id==="pbq"){window.pbq=t.value;$("#pbus").innerHTML=pedBus()}
 else if(t.id==="jtel"){S.jefaTel=t.value;save();var jp=$("#jprev");if(jp)jp.textContent=jprev();var wb=$("#wabtn");if(wb)wb.href=waUrl(S.ultimo||"")}
 else if(t.id==="pcli"){D().cli=t.value;save()}
 else if(t.dataset.f){var f=t.dataset.f,dd=D();if(t.dataset.i!==undefined)dd.items[+t.dataset.i][f]=t.value;else dd[f]=t.value;save();pedOut()}
});
document.addEventListener("change",function(e){var t=e.target;if(t.id==="impf"&&t.files&&t.files[0]){var r=new FileReader();r.onload=function(){importar(String(r.result))};r.readAsText(t.files[0]);t.value=""}});
loadPrecios();
render();
</script>
</body>
