<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preventa Zárate</title>
<style>
:root{--bg:#eceff1;--card:#fff;--ink:#101820;--mut:#5b6872;--line:#d3dae0;--acc:#0a5c7a;--accT:#fff;--ok:#2e7d4f;--skip:#a8620a;--bad:#b3261e;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1419;--card:#18212a;--ink:#e8eef2;--mut:#94a3ad;--line:#2b3742;--acc:#4cb8dc;--accT:#06222d;--ok:#5cc386;--skip:#e0a04a;--bad:#f2837c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1419;--card:#18212a;--ink:#e8eef2;--mut:#94a3ad;--line:#2b3742;--acc:#4cb8dc;--accT:#06222d;--ok:#5cc386;--skip:#e0a04a;--bad:#f2837c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
h2{font-size:17px;margin:20px 0 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:1;min-width:0;padding:9px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.chip.on{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
.sum{display:flex;justify-content:space-between;align-items:center;margin:12px 0;color:var(--mut);font-size:14px;gap:8px}
button,.btn{font:inherit;font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;display:inline-block;text-align:center}
button.p{background:var(--acc);color:var(--accT);border-color:var(--acc);font-weight:600}
button.ok{color:var(--ok);border-color:var(--ok)}
button.sk{color:var(--skip);border-color:var(--skip)}
button.dg{color:var(--bad);border-color:var(--bad)}
button.w{width:100%}
ol{list-style:none;margin:0;padding:0}
.stop{display:flex;gap:12px;position:relative;padding-bottom:12px}
.stop:not(:last-child)::before{content:"";position:absolute;left:15px;top:34px;bottom:0;width:2px;background:var(--line)}
.n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--accT);font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.stop.d .n{background:var(--ok)}.stop.s .n{background:var(--skip)}
.b{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stop.d .b,.stop.s .b{opacity:.65}
.b b{display:block;font-size:17px}
.b .t{display:block;color:var(--mut);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row>*{flex:1 1 auto;padding:8px 10px;font-size:14px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.res{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
.res.big{font-size:20px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{color:var(--mut);text-align:center;padding:28px 8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 2px;font-size:13px;color:var(--mut)}
nav button.on{color:var(--acc);font-weight:700}
#toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:10px;font-size:14px;display:none;z-index:5}
details{margin-top:18px}summary{padding:8px 0;color:var(--acc)}
.hint{font-size:13px;color:var(--mut);margin:6px 0 0}
.pr{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.pr span:first-child{color:var(--mut);font-size:13px}
.pr b{font-size:18px;white-space:nowrap}
</style>
</head>
<body>
<main id="view"></main>
<div id="toast"></div>
<nav>
<button data-tab="hoy">Ruta de hoy</button>
<button data-tab="cli">Clientes</button>
<button data-tab="pre">Precios</button>
<button data-tab="calc">Calculadora</button>
<button data-tab="pap">Papelera</button>
</nav>
<script>
var K="preventa_zarate_v1",BASE=[-34.0971,-59.0282];
var DIAS=["domingo","lunes","martes","miercoles","jueves","viernes","sabado"];
var S=load(),tab="hoy",editId=null,showForm=false,q="";
var dia=(function(){var d=DIAS[new Date().getDay()];return DIAS.indexOf(d)%6===0?"lunes":d})();
var C={lines:[{p:"",c:""}],d:"",m:"5"};
function load(){try{var r=localStorage.getItem(K);if(r)return JSON.parse(r)}catch(e){}return{clientes:[],papelera:[],hoy:{f:"",v:[],s:[]},pos:null}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fm(n){return new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS"}).format(n)}
function num(t){t=String(t).replace(/[$\s]/g,"");if(t.indexOf(",")>-1)t=t.replace(/\./g,"").replace(",",".");var n=parseFloat(t);return isFinite(n)&&n>=0?n:0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function toast(m){var t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},3500)}
function normDia(d){d=String(d||"").trim().toLowerCase();return d==="miércoles"?"miercoles":d}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function hasC(c){return typeof c.lat==="number"&&typeof c.lon==="number"}
function hav(a,b){var R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)*Math.sin(dn/2);return 2*R*Math.asin(Math.sqrt(x))}
function total(o,r){var t=0,p=o;r.forEach(function(c){var x=[c.lat,c.lon];t+=hav(p,x);p=x});return t}
function optim(items){
 var ci=items.filter(hasC),rest=items.filter(function(c){return!hasC(c)}),o=S.pos||BASE,r=[],p=o,pool=ci.slice();
 while(pool.length){var bi=0,bd=1e18;pool.forEach(function(c,i){var d=hav(p,[c.lat,c.lon]);if(d<bd){bd=d;bi=i}});var c=pool.splice(bi,1)[0];r.push(c);p=[c.lat,c.lon]}
 var imp=r.length>=3,best=total(o,r);
 while(imp){imp=false;
  for(var i=0;i<r.length-1&&!imp;i++)for(var j=i+1;j<r.length&&!imp;j++){
   var n=r.slice();var seg=n.slice(i,j+1).reverse();Array.prototype.splice.apply(n,[i,j-i+1].concat(seg));
   var d=total(o,n);if(d+.01<best){r=n;best=d;imp=true}}}
 return r.concat(rest)}
function hoyState(){var f=new Date().toISOString().slice(0,10);if(!S.hoy||S.hoy.f!==f){S.hoy={f:f,v:[],s:[]};save()}return S.hoy}
function mapUrl(c){return "https://www.google.com/maps/dir/?api=1&destination="+(hasC(c)?c.lat+","+c.lon:encodeURIComponent((c.direccion||"")+", Zárate, Buenos Aires"))}
function gps(cb){if(!navigator.geolocation){toast("Este navegador no permite usar la ubicación.");return}
 navigator.geolocation.getCurrentPosition(function(p){cb([p.coords.latitude,p.coords.longitude])},function(){toast("No se pudo obtener la ubicación. Revisá el permiso de ubicación del navegador.")},{enableHighAccuracy:true,timeout:10000})}
function parseLoc(t){t=String(t||"");var m=t.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);if(!m)return null;var a=parseFloat(m[1]),b=parseFloat(m[2]);return(Math.abs(a)<=90&&Math.abs(b)<=180)?[a,b]:null}

async function geocode(addr){
 var u="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q="+encodeURIComponent(addr+", Zárate, Buenos Aires, Argentina");
 var r=await fetch(u,{headers:{"Accept-Language":"es"}});var j=await r.json();
 if(!j.length)return null;return[parseFloat(j[0].lat),parseFloat(j[0].lon),j[0].display_name]}
async function guardarCliente(){
 var n=$("#f-n").value.trim(),d=$("#f-d").value.trim();if(!n||!d){toast("Completá el nombre y la dirección.");return}
 var lt=$("#f-l").value.trim(),p=parseLoc(lt);if(lt&&!p){toast("No entendí la ubicación. Usá el formato -34.0971, -59.0282 o dejalo vacío.");return}
 var msg="Cliente guardado.";
 if(!p){toast("Buscando la dirección en el mapa...");
  try{var g=await geocode(d);if(g){p=[g[0],g[1]];msg="Cliente guardado. Ubicación: "+g[2].slice(0,70)}else msg="Cliente guardado, pero no se encontró la dirección. Probá con calle y número."}
  catch(e){msg="Cliente guardado sin ubicación: no se pudo buscar la dirección (¿hay internet?)."}}
 var c=S.clientes.filter(function(x){return x.id===editId})[0];if(!c){c={id:uid()};S.clientes.push(c)}
 c.nombre=n;c.direccion=d;c.dia=$("#f-dia").value;c.horario=$("#f-h").value.trim();c.telefono=$("#f-t").value.trim();
 if(p){c.lat=p[0];c.lon=p[1]}else{delete c.lat;delete c.lon}
 save();showForm=false;editId=null;render();toast(msg)}
function vHoy(){
 var h=hoyState(),L=S.clientes.filter(function(c){return c.dia===dia});
 var pend=optim(L.filter(function(c){return h.v.indexOf(c.id)<0&&h.s.indexOf(c.id)<0}));
 var done=L.filter(function(c){return h.v.indexOf(c.id)>-1||h.s.indexOf(c.id)>-1});
 var o="<h1>Ruta de hoy</h1><div class=chips>"+DIAS.slice(1,6).map(function(d){return"<button class='chip"+(d===dia?" on":"")+"' data-a=dia data-id="+d+">"+cap(d.slice(0,3))+"</button>"}).join("")+"</div>";
 o+="<div class=sum><span>"+(L.length?"Quedan "+pend.length+" de "+L.length:"Sin clientes este día")+"</span><button data-a=ubic>"+(S.pos?"Ubicación actualizada":"Usar mi ubicación")+"</button></div>";
 if(!L.length)return o+"<p class=empty>Todavía no hay clientes para el "+dia+". Agregalos en la pestaña Clientes.</p>";
 if(!pend.length)o+="<p class=empty>Terminaste todas las visitas de este día.</p>";
 o+="<ol>";
 pend.forEach(function(c,i){o+=stop(c,i+1,"")});
 done.forEach(function(c){var v=h.v.indexOf(c.id)>-1;o+=stop(c,v?"✔":"–",v?"d":"s")});
 return o+"</ol>"}
function stop(c,n,cls){
 var acts=cls?"<button data-a=undo data-id="+c.id+">Volver a pendiente</button>":"<button class=ok data-a=ok data-id="+c.id+">Visitado</button><button class=sk data-a=skip data-id="+c.id+">Saltar</button>";
 return"<li class='stop "+cls+"'><span class=n>"+n+"</span><div class=b><b>"+esc(c.nombre)+"</b><span class=t>"+esc(c.direccion)+"</span>"+(c.horario?"<span class=t>Horario: "+esc(c.horario)+"</span>":"")+"<div class=row>"+acts+"<a class=btn href='"+mapUrl(c)+"' target=_blank rel=noopener>Mapa</a>"+(c.telefono?"<a class=btn href='tel:"+esc(c.telefono.replace(/[^\d+]/g,""))+"'>Llamar</a>":"")+"</div></div></li>"}

function vCli(){
 var o="<h1>Clientes</h1>";
 if(showForm)o+=form();else o+="<button class='p w' data-a=nuevo>Agregar cliente</button>";
 o+="<label for=q>Buscar por nombre o dirección</label><input id=q value='"+esc(q)+"'><div id=lista>"+lista()+"</div>";
 o+="<details><summary>Importar y respaldo</summary><p class=hint>Para traer tus clientes del programa en Python, abrí el archivo locales_preventa.json, copiá todo el texto y pegalo acá.</p><textarea id=imp rows=4 placeholder='Pegá acá el contenido del archivo'></textarea><div class=row><button class=p data-a=import>Importar clientes</button><button data-a=resp>Copiar respaldo</button></div></details>";
 return o}
function lista(){
 var t=q.trim().toLowerCase(),L=S.clientes.filter(function(c){return!t||(c.nombre+" "+c.direccion).toLowerCase().indexOf(t)>-1});
 if(!L.length)return"<p class=empty>"+(S.clientes.length?"Sin resultados.":"Todavía no cargaste clientes.")+"</p>";
 return L.map(function(c){return"<div class=card><b>"+esc(c.nombre)+"</b><span class=t style='display:block;color:var(--mut);font-size:14px'>"+esc(c.direccion)+" · "+cap(c.dia)+(hasC(c)?"":" · sin ubicación")+"</span><div class=row><button data-a=edit data-id="+c.id+">Editar</button><button class=dg data-a=del data-id="+c.id+">A la papelera</button></div></div>"}).join("")}
function form(){
 var c=S.clientes.filter(function(x){return x.id===editId})[0]||{};
 return"<div class=card><b>"+(editId?"Editar cliente":"Nuevo cliente")+"</b><label for=f-n>Nombre del local o dueño</label><input id=f-n value='"+esc(c.nombre)+"'><label for=f-d>Dirección y altura</label><input id=f-d value='"+esc(c.direccion)+"'><label for=f-dia>Día de visita</label><select id=f-dia>"+DIAS.slice(1,6).map(function(d){return"<option value="+d+(d===(c.dia||dia)?" selected":"")+">"+cap(d)+"</option>"}).join("")+"</select><div class=two><div><label for=f-h>Horario</label><input id=f-h value='"+esc(c.horario)+"'></div><div><label for=f-t>Teléfono</label><input id=f-t type=tel value='"+esc(c.telefono)+"'></div></div><label for=f-l>Ubicación (opcional)</label><input id=f-l placeholder='-34.0971, -59.0282' value='"+(hasC(c)?c.lat+", "+c.lon:"")+"'><p class=hint>Dejalo vacío y la app busca la dirección sola al guardar. También podés tocar el botón parado frente al local.</p><div class=row><button data-a=loc>Usar mi ubicación actual</button></div><div class=row><button class=p data-a=guardar>Guardar cliente</button><button data-a=cancelar>Cancelar</button></div></div>"}

function vCalc(){
 var o="<h1>Calculadora</h1><div class=card><b>Productos</b>";
 C.lines.forEach(function(l,i){o+="<div class=two><div><label>Precio $</label><input inputmode=decimal data-f=p data-i="+i+" value='"+esc(l.p)+"'></div><div><label>Cantidad</label><input inputmode=decimal data-f=c data-i="+i+" value='"+esc(l.c)+"'></div></div>"});
 o+="<div class=row><button data-a=addl>Agregar producto</button>"+(C.lines.length>1?"<button data-a=dell>Quitar último</button>":"")+"</div></div>";
 o+="<div class=card><div class=two><div><label>Descuento %</label><input inputmode=decimal data-f=d value='"+esc(C.d)+"'></div><div><label>Comisión %</label><input inputmode=decimal data-f=m value='"+esc(C.m)+"'></div></div></div><div class=card id=out></div>";
 return o}
function calcOut(){
 var sub=0;C.lines.forEach(function(l){sub+=num(l.p)*num(l.c)});
 var d=Math.min(num(C.d),100),desc=sub*d/100,fin=sub-desc,com=fin*num(C.m)/100;
 var e=$("#out");if(e)e.innerHTML="<div class=res><span>Subtotal</span><span>"+fm(sub)+"</span></div><div class=res><span>Descuento</span><span>− "+fm(desc)+"</span></div><div class='res big'><span>Total</span><span>"+fm(fin)+"</span></div><div class=res><span>Tu comisión</span><span>"+fm(com)+"</span></div>"}

function vPap(){
 var o="<h1>Papelera</h1>";
 if(!S.papelera.length)return o+"<p class=empty>La papelera está vacía.</p>";
 o+=S.papelera.map(function(c){return"<div class=card><b>"+esc(c.nombre)+"</b><span style='display:block;color:var(--mut);font-size:14px'>"+esc(c.direccion)+"</span><div class=row><button class=p data-a=rest data-id="+c.id+">Restaurar</button><button class=dg data-a=fin data-id="+c.id+">Borrar para siempre</button></div></div>"}).join("");
 return o+"<button class='dg w' data-a=vaciar style='margin-top:10px'>Vaciar papelera</button>"}

var P=null;
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function prep(j){j.productos.forEach(function(p){p[4]=norm(p[0]+" "+p[1])});return j}
function loadPrecios(){
 try{var c=localStorage.getItem("preventa_precios_v1");if(c)P=prep(JSON.parse(c))}catch(e){}
 fetch("precios.json?v="+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
  try{localStorage.setItem("preventa_precios_v1",JSON.stringify(j))}catch(e){}
  P=prep(j);if(tab==="pre"&&!document.getElementById("pq").value)render();else if(tab==="pre")$("#pres").innerHTML=preRes()
 }).catch(function(){})}
function etq(i){var l=P.listas[i];return l.nombre+" · "+[l.lista,l.iva].filter(Boolean).join(", ")}
function vPre(){
 return"<h1>Precios</h1><label for=pq>Código o nombre del producto</label><input id=pq inputmode=search autocomplete=off placeholder='Ej: 1957 o bolsa polip 15x20' value='"+esc(window.pq||"")+"'><div id=pres>"+preRes()+"</div>"}
function preRes(){
 if(!P)return"<p class=empty>Cargando precios... Si no aparecen, revisá que el archivo precios.json esté subido a GitHub.</p>";
 var t=norm(window.pq||"").trim();
 if(!t)return"<p class=hint>Listas cargadas:</p>"+P.listas.map(function(l,i){var n=P.productos.filter(function(p){return p[3]===i}).length;return"<div class=card><b>"+esc(l.nombre)+"</b><span style='display:block;color:var(--mut);font-size:14px'>"+esc([l.lista,l.iva,l.fecha].filter(Boolean).join(" · "))+" · "+n+" productos</span></div>"}).join("");
 var toks=t.split(/\s+/),map={},ord=[];
 P.productos.forEach(function(p){
  for(var i=0;i<toks.length;i++)if(p[4].indexOf(toks[i])<0)return;
  var k=p[0]+"|"+p[1].toLowerCase();
  if(!map[k]){map[k]={cod:p[0],nom:p[1],pr:[]};ord.push(map[k])}
  map[k].pr.push([p[3],p[2]])});
 if(!ord.length)return"<p class=empty>No se encontraron productos con eso.</p>";
 if(toks.length===1&&/^\d+$/.test(toks[0]))ord.sort(function(a,b){return(b.cod===toks[0])-(a.cod===toks[0])});
 var o="<p class=hint>"+ord.length+" producto"+(ord.length>1?"s":"")+(ord.length>40?" (se muestran los primeros 40, refiná la búsqueda)":"")+"</p>";
 ord.slice(0,40).forEach(function(x){
  o+="<div class=card><b>"+esc(x.nom)+"</b><span style='display:block;color:var(--mut);font-size:14px'>Código "+esc(x.cod)+"</span>"+x.pr.map(function(r){return"<div class=pr><span>"+esc(etq(r[0]))+"</span><b>"+fm(r[1])+"</b></div>"}).join("")+"</div>"});
 return o}
function render(){
 $("#view").innerHTML={hoy:vHoy,cli:vCli,pre:vPre,calc:vCalc,pap:vPap}[tab]();
 document.querySelectorAll("nav button").forEach(function(b){b.classList.toggle("on",b.dataset.tab===tab)});
 if(tab==="calc")calcOut()}
function take(id){var i=S.clientes.findIndex(function(c){return c.id===id});return i<0?null:S.clientes.splice(i,1)[0]}
function mark(id,k){var h=hoyState();["v","s"].forEach(function(x){var i=h[x].indexOf(id);if(i>-1)h[x].splice(i,1)});if(k)h[k].push(id);save();render()}

document.addEventListener("click",function(e){
 var t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return}
 var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
 if(a==="dia"){dia=id;render()}
 else if(a==="ubic")gps(function(p){S.pos=p;save();render();toast("Ruta recalculada desde tu ubicación.")})
 else if(a==="ok")mark(id,"v")
 else if(a==="skip")mark(id,"s")
 else if(a==="undo")mark(id,null)
 else if(a==="nuevo"){showForm=true;editId=null;render()}
 else if(a==="cancelar"){showForm=false;editId=null;render()}
 else if(a==="edit"){showForm=true;editId=id;render();window.scrollTo(0,0)}
 else if(a==="loc")gps(function(p){$("#f-l").value=p[0].toFixed(6)+", "+p[1].toFixed(6);toast("Ubicación cargada.")})
 else if(a==="guardar"){guardarCliente()}
 else if(a==="del"){var c2=take(id);if(c2){c2.eliminado=new Date().toISOString();S.papelera.push(c2);save();render();toast("Movido a la papelera.")}}
 else if(a==="rest"){var i=S.papelera.findIndex(function(c){return c.id===id});if(i>-1){var r=S.papelera.splice(i,1)[0];delete r.eliminado;S.clientes.push(r);save();render();toast("Cliente restaurado.")}}
 else if(a==="fin"){S.papelera=S.papelera.filter(function(c){return c.id!==id});save();render()}
 else if(a==="vaciar"){if(confirm("¿Borrar todo lo que hay en la papelera?")){S.papelera=[];save();render()}}
 else if(a==="addl"){C.lines.push({p:"",c:""});render()}
 else if(a==="dell"){C.lines.pop();render()}
 else if(a==="import"){
  try{var arr=JSON.parse($("#imp").value);if(!Array.isArray(arr))throw 0;var k=0;
   arr.forEach(function(x){if(!x||!x.nombre)return;var lat=parseFloat(x.latitud),lon=parseFloat(x.longitud);
    var c={id:uid(),nombre:String(x.nombre).trim(),direccion:String(x.direccion||"").trim(),dia:normDia(x.dia)||"lunes",horario:x.horario||"",telefono:x.telefono||""};
    if(isFinite(lat)&&isFinite(lon)){c.lat=lat;c.lon=lon}S.clientes.push(c);k++});
   save();$("#imp").value="";render();toast("Se importaron "+k+" clientes.")}
  catch(err){toast("No se pudo leer el texto. Copiá el archivo completo, desde el primer corchete hasta el último.")}}
 else if(a==="resp"){var txt=JSON.stringify(S.clientes);
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(function(){toast("Respaldo copiado. Pegalo en Notas para guardarlo.")},function(){$("#imp").value=txt;toast("Copialo desde el cuadro de texto.")});
  else{$("#imp").value=txt;toast("Copialo desde el cuadro de texto.")}}
});
document.addEventListener("input",function(e){
 var t=e.target;
 if(t.id==="q"){q=t.value;$("#lista").innerHTML=lista()}
 else if(t.id==="pq"){window.pq=t.value;$("#pres").innerHTML=preRes()}
 else if(t.dataset.f){var f=t.dataset.f;if(f==="p"||f==="c")C.lines[+t.dataset.i][f]=t.value;else C[f]=t.value;calcOut()}
});
loadPrecios();
render();
</script>
</body>
</html>
